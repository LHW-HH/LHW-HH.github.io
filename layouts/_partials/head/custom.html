<meta name="theme-color" content="#040610">
{{ with resources.Get "img/apple-touch-icon.png" }}<link rel="apple-touch-icon" href="{{ .RelPermalink }}">{{ end }}

<style>
  :root {
    --base-font-family: "SF Pro", "Noto Sans CJK SC", "Microsoft YaHei UI", Arial, sans-serif;
    --article-font-family: "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", STSong, serif;
    --code-font-family: "Cascadia Mono", Consolas, monospace;
  }
</style>

{{ if and hugo.IsServer (not .IsHome) }}
<style>
.archive-shell .writer-fab {
    position: fixed;
    bottom: 18px;
    left: 18px;
    z-index: 100;
    display: inline-flex;
    min-height: 38px;
    align-items: center;
    padding: 0 15px;
    border-radius: 999px;
    color: #090807;
    background: #8db2ff;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
    text-decoration: none;
  }

  .archive-shell .writer-fab:hover {
    background: #67f5d4;
  }
</style>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var link = document.createElement("a");
    link.className = "writer-fab";
    link.href = "http://127.0.0.1:1315/";
    link.target = "_blank";
    link.rel = "noopener";
    link.textContent = "写新文章";
    document.body.appendChild(link);
  });
</script>
{{ end }}
